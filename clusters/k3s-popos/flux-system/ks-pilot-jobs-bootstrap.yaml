apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pilot-jobs-bootstrap
  namespace: flux-system
spec:
  dependsOn:
    - name: pilot-jobs-migrate
  interval: 10m
  timeout: 20m
  wait: true
  force: true
  prune: true
  sourceRef:
    kind: GitRepository
    name: acomofferdesk
  path: ./deploy/k8s/pilot/flux-phases/jobs-bootstrap
