apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications-worker
  namespace: acom-offer-desk-pilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notifications-worker
  template:
    metadata:
      labels:
        app: notifications-worker
        acom.security/tier: app
    spec:
      serviceAccountName: acom-pilot-runtime
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: worker
          image: acom-notifications-worker:c96bc2643cfc
          imagePullPolicy: Never
          command: ["python", "-m", "app.main"]
          env:
            - name: RABBITMQ_SSL_CAFILE
              value: /etc/ssl/rabbitmq/ca.crt
            - name: RABBITMQ_SSL_CERTFILE
              value: /etc/ssl/rabbitmq/client.crt
            - name: RABBITMQ_SSL_KEYFILE
              value: /etc/ssl/rabbitmq/client.key
          envFrom:
            - secretRef:
                name: acom-app-secrets
            - configMapRef:
                name: acom-backend-env
          livenessProbe:
            exec:
              command: ["pgrep", "-f", "celery"]
            initialDelaySeconds: 60
            periodSeconds: 30
          volumeMounts:
            - name: rabbitmq-tls
              mountPath: /etc/ssl/rabbitmq
              readOnly: true

      volumes:
        - name: rabbitmq-tls
          secret:
            secretName: rabbitmq-tls
            items:
              - key: ca.crt
                path: ca.crt
              - key: client.crt
                path: client.crt
              - key: client.key
                path: client.key
