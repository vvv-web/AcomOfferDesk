apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: acom-offer-desk-pilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
        acom.security/tier: data
    spec:
      serviceAccountName: acom-pilot-data
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management
          ports:
            - containerPort: 5671
              name: amqps
            - containerPort: 15672
              name: management
          envFrom:
            - secretRef:
                name: acom-app-secrets
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            periodSeconds: 10
          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
            - name: rabbitmq-config
              mountPath: /etc/rabbitmq/rabbitmq.conf
              subPath: rabbitmq.conf
            - name: rabbitmq-config
              mountPath: /etc/rabbitmq/enabled_plugins
              subPath: enabled_plugins
            - name: rabbitmq-tls
              mountPath: /etc/rabbitmq/tls
              readOnly: true
      volumes:
        - name: rabbitmq-data
          emptyDir: {}
        - name: rabbitmq-config
          configMap:
            name: rabbitmq-config
        - name: rabbitmq-tls
          secret:
            secretName: rabbitmq-tls
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: acom-offer-desk-pilot
spec:
  type: ClusterIP
  selector:
    app: rabbitmq
  ports:
    - name: amqps
      port: 5671
      targetPort: 5671
