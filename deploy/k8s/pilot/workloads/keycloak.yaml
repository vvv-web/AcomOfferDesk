apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: acom-offer-desk-pilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
        acom.security/tier: app
      annotations:
        acom.deploy/sha: "8ea43577e06e5fd8072d1e1438b9f102e0b3b8b9"
    spec:
      serviceAccountName: acom-pilot-data
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      initContainers:
        - name: keycloak-db-schema
          image: postgres:16-alpine
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          command:
            - /bin/sh
            - -ec
            - |
              until pg_isready -h "$PGHOST" -p 5432 -U "$DB_USER" -d "$DB_NAME"; do sleep 2; done
              export PGSSLMODE=verify-full
              export PGSSLROOTCERT=/etc/ssl/postgres/ca.crt
              PGPASSWORD="$DB_PASSWORD" psql -h "$PGHOST" -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 \
                -c "CREATE SCHEMA IF NOT EXISTS \"${KC_DB_SCHEMA}\" AUTHORIZATION \"${DB_USER}\";"
          env:
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: acom-app-secrets
                  key: KC_DB_URL_HOST
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: acom-app-secrets
                  key: KC_DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: acom-app-secrets
                  key: KC_DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: acom-app-secrets
                  key: KC_DB_URL_DATABASE
            - name: KC_DB_SCHEMA
              valueFrom:
                secretKeyRef:
                  name: acom-app-secrets
                  key: KC_DB_SCHEMA
          volumeMounts:
            - name: postgres-tls
              mountPath: /etc/ssl/postgres
              readOnly: true
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.5
          args: ["start", "--import-realm"]
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9000
              name: management
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          startupProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 5
            failureThreshold: 60
          envFrom:
            - secretRef:
                name: acom-app-secrets
            - configMapRef:
                name: acom-backend-env
          env:
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_METRICS_ENABLED
              value: "true"
          volumeMounts:
            - name: keycloak-data
              mountPath: /opt/keycloak/data
            - name: realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true
      volumes:
        - name: keycloak-data
          emptyDir: {}
        - name: realm-import
          configMap:
            name: keycloak-realm-import
        - name: postgres-tls
          secret:
            secretName: postgres-tls
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: acom-offer-desk-pilot
spec:
  type: ClusterIP
  selector:
    app: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: 8080
