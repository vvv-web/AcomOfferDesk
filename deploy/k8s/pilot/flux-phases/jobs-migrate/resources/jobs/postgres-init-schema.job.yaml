apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-init-schema
  namespace: acom-offer-desk-pilot
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        acom.security/tier: app
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-postgres
          image: postgres:16-alpine
          command:
            - /bin/sh
            - -ec
            - |
              export PGPASSWORD="$POSTGRES_PASSWORD"
              export PGSSLMODE=verify-full
              export PGSSLROOTCERT=/etc/ssl/postgres/ca.crt
              for i in $(seq 1 90); do
                if pg_isready -h "$PGHOST" -U "$POSTGRES_USER" -d "$POSTGRES_DB" >/dev/null 2>&1; then
                  exit 0
                fi
                sleep 2
              done
              echo "postgres not ready after 180s" >&2
              exit 1
          env:
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: acom-app-secrets
                  key: KC_DB_URL_HOST
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: acom-app-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: acom-app-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: acom-app-secrets
                  key: POSTGRES_DB
          volumeMounts:
            - name: pg-ca
              mountPath: /etc/ssl/postgres
              readOnly: true
      containers:
        - name: psql
          image: postgres:16-alpine
          command:
            - /bin/sh
            - -ec
            - |
              export PGPASSWORD="$POSTGRES_PASSWORD"
              export PGSSLMODE=verify-full
              export PGSSLROOTCERT=/etc/ssl/postgres/ca.crt
              psql -v ON_ERROR_STOP=1 -h "$PGHOST" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -f /schema/01-schema.sql
              psql -v ON_ERROR_STOP=1 -h "$PGHOST" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -f /schema/03-bootstrap-admin.sql
          env:
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: acom-app-secrets
                  key: KC_DB_URL_HOST
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: acom-app-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: acom-app-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: acom-app-secrets
                  key: POSTGRES_DB
          volumeMounts:
            - name: schema
              mountPath: /schema
              readOnly: true
            - name: pg-ca
              mountPath: /etc/ssl/postgres
              readOnly: true
      volumes:
        - name: schema
          configMap:
            name: order-database-schema
        - name: pg-ca
          secret:
            secretName: postgres-tls
