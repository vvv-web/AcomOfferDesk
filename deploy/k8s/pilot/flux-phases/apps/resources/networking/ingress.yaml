apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: acom-pilot
  namespace: acom-offer-desk-pilot
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - pilot.acom-offer-desk.ru
      secretName: acom-pilot-tls
  rules:
    - host: pilot.acom-offer-desk.ru
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /iam
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
