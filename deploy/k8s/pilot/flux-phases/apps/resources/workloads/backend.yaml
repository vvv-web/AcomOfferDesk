apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: acom-offer-desk-pilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        acom.security/tier: app
      annotations:
        acom.deploy/sha: "7aba20a5a9fda02112952dfac841c168d1298178"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: backend
          image: acom-backend:7aba20a5a9fd
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 45
            periodSeconds: 15
          envFrom:
            - secretRef:
                name: acom-app-secrets
            - configMapRef:
                name: acom-backend-env
          env:
            - name: APP_ENV
              value: production
            - name: PGSSLMODE
              value: verify-full
            - name: PGSSLROOTCERT
              value: /etc/ssl/postgres/ca.crt
          volumeMounts:
            - name: postgres-tls
              mountPath: /etc/ssl/postgres
              readOnly: true
      volumes:
        - name: postgres-tls
          secret:
            secretName: postgres-tls
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: acom-offer-desk-pilot
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
