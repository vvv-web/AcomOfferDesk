apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: acom-offer-desk-pilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
        acom.security/tier: data
    spec:
      serviceAccountName: acom-pilot-data
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: minio
          image: minio/minio:RELEASE.2024-12-18T13-15-44Z
          args: ["server", "/data", "--certs-dir", "/certs", "--console-address", ":9001"]
          ports:
            - containerPort: 9000
            - containerPort: 9001
          env:
            - name: MINIO_SERVER_URL
              value: "https://minio:9000"
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
              scheme: HTTPS
            periodSeconds: 10
          envFrom:
            - secretRef:
                name: acom-app-secrets
          volumeMounts:
            - name: minio-data
              mountPath: /data
            - name: minio-tls
              mountPath: /certs
              readOnly: true
            - name: minio-tls-ca
              mountPath: /certs/CAs
              readOnly: true
      volumes:
        - name: minio-data
          emptyDir: {}
        - name: minio-tls
          secret:
            secretName: minio-tls
            items:
              - key: private.key
                path: private.key
              - key: public.crt
                path: public.crt
        - name: minio-tls-ca
          secret:
            secretName: minio-tls
            items:
              - key: ca.crt
                path: ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: acom-offer-desk-pilot
spec:
  type: ClusterIP
  selector:
    app: minio
  ports:
    - port: 9000
      targetPort: 9000
