apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-init-deploy
  namespace: acom-offer-desk-pilot
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    spec:
      restartPolicy: Never
      volumes:
        - name: postgres-tls
          secret:
            secretName: postgres-tls
        - name: pilot-scripts
          configMap:
            name: pilot-job-scripts
            defaultMode: 0555
      containers:
        - name: init
          image: acom-backend:c96bc2643cfc
          imagePullPolicy: Never
          command: ["/bin/sh", "/pilot-scripts/keycloak-init-deploy-k8s.sh"]
          volumeMounts:
            - name: postgres-tls
              mountPath: /etc/ssl/postgres
              readOnly: true
            - name: pilot-scripts
              mountPath: /pilot-scripts
              readOnly: true
          env:
            - name: KEYCLOAK_INTERNAL_BASE_URL
              value: "http://keycloak:8080/iam"
            - name: PGSSLROOTCERT
              value: /etc/ssl/postgres/ca.crt
          envFrom:
            - secretRef:
                name: acom-app-secrets
            - configMapRef:
                name: acom-backend-env
