apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-db-prepare
  namespace: acom-offer-desk-pilot
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: prepare
          image: postgres:16-alpine
          command:
            - /bin/sh
            - -ec
            - |
              until pg_isready -h "$PGHOST" -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do sleep 2; done
              export PGSSLMODE=require
              PGPASSWORD="$POSTGRES_PASSWORD" psql -h "$PGHOST" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 \
                -c "CREATE SCHEMA IF NOT EXISTS keycloak AUTHORIZATION \"$POSTGRES_USER\";"
          env:
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: acom-app-secrets
                  key: KC_DB_URL_HOST
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: acom-app-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: acom-app-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: acom-app-secrets
                  key: POSTGRES_DB
