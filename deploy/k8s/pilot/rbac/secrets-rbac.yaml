# SB Step 6 (R-C2): RBAC для Secret — runtime SA без get/list secrets; оператор отдельно.
# Оф. RBAC: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
apiVersion: v1
kind: ServiceAccount
metadata:
  name: acom-pilot-runtime
  namespace: acom-offer-desk-pilot
  labels:
    acom.security/rbac-tier: runtime
    app.kubernetes.io/part-of: acom-offer-desk
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: acom-pilot-data
  namespace: acom-offer-desk-pilot
  labels:
    acom.security/rbac-tier: data
    app.kubernetes.io/part-of: acom-offer-desk
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: acom-pilot-secrets-operator
  namespace: acom-offer-desk-pilot
  labels:
    acom.security/rbac-tier: operator
    app.kubernetes.io/part-of: acom-offer-desk
---
# Минимальные права runtime/data: ConfigMap + own Pod logs — без secrets API.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: acom-pilot-workload-minimal
  namespace: acom-offer-desk-pilot
  labels:
    acom.security/rbac-tier: runtime
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
# Оператор: создаёт/обновляет Secret вручную (apply-pilot-secrets.sh) или будущий ESO/SealedSecrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: acom-pilot-secrets-operator
  namespace: acom-offer-desk-pilot
  labels:
    acom.security/rbac-tier: operator
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    resourceNames:
      - acom-app-secrets
      - postgres-tls
      - acom-pilot-tls
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: acom-pilot-runtime-minimal
  namespace: acom-offer-desk-pilot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: acom-pilot-workload-minimal
subjects:
  - kind: ServiceAccount
    name: acom-pilot-runtime
    namespace: acom-offer-desk-pilot
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: acom-pilot-data-minimal
  namespace: acom-offer-desk-pilot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: acom-pilot-workload-minimal
subjects:
  - kind: ServiceAccount
    name: acom-pilot-data
    namespace: acom-offer-desk-pilot
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: acom-pilot-secrets-operator
  namespace: acom-offer-desk-pilot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: acom-pilot-secrets-operator
subjects:
  - kind: ServiceAccount
    name: acom-pilot-secrets-operator
    namespace: acom-offer-desk-pilot
