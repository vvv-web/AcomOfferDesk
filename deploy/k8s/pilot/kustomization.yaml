# Kustomize entry — пилот AcomOfferDesk (pop-os k3s)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: acom-offer-desk-pilot

configMapGenerator:
  - name: pilot-job-scripts
    files:
      - scripts/write-pilot-env.py
      - scripts/keycloak-init-deploy-k8s.sh
      - scripts/post-deploy-verify-k8s.sh
    options:
      disableNameSuffixHash: true

resources:
  - namespace.yaml
  - config/rabbitmq-configmap.yaml
  - data/postgres-statefulset.yaml
  - workloads/rabbitmq.yaml
  - workloads/minio.yaml
  - workloads/keycloak.yaml
  - workloads/backend.yaml
  - workloads/web.yaml
  - workloads/notifications-worker.yaml
  - networking/ingress.yaml
  - networking/networkpolicy.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: acom-offer-desk
      acom.deploy/environment: pilot

commonAnnotations:
  acom.deploy/sha: "7aba20a5a9fda02112952dfac841c168d1298178"
