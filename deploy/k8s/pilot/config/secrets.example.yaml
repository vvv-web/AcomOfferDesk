# Пример Secret — ТОЛЬКО ключи, БЕЗ значений в git (R-C1).
# Создать реальный Secret: ./scripts/apply-pilot-secrets.sh (оператор, RBAC R-C2).
# Runbook: docs/RUNBOOK-PILOT-SECRETS-RBAC.md
apiVersion: v1
kind: Secret
metadata:
  name: acom-app-secrets
  namespace: acom-offer-desk-pilot
  labels:
    acom.security/managed-by: acom-pilot-operator
type: Opaque
stringData:
  DATABASE_URL: "CHANGE_ME_postgresql_url_with_verify_full"
  JWT_SECRET_KEY: "CHANGE_ME_jwt_secret"
  JWT_ALGORITHM: "CHANGE_ME_jwt_algorithm"
  KEYCLOAK_ADMIN: "CHANGE_ME_kc_admin"
  KEYCLOAK_ADMIN_PASSWORD: "CHANGE_ME_kc_admin_password"
  KEYCLOAK_BOOTSTRAP_USERNAME: "CHANGE_ME_bootstrap_user"
  KEYCLOAK_BOOTSTRAP_PASSWORD: "CHANGE_ME_bootstrap_password"
  RABBITMQ_DEFAULT_USER: "CHANGE_ME_rmq_user"
  RABBITMQ_DEFAULT_PASS: "CHANGE_ME_rmq_password"
  CELERY_BROKER_URL: "CHANGE_ME_amqps_url"
  MINIO_ROOT_USER: "CHANGE_ME_not_linux_root"
  MINIO_ROOT_PASSWORD: "CHANGE_ME_minio_password"
  S3_ENDPOINT: "CHANGE_ME_s3_endpoint"
  S3_ACCESS_KEY: "CHANGE_ME_s3_access"
  S3_SECRET_KEY: "CHANGE_ME_s3_secret"
