# Пример Secret — ТОЛЬКО ключи, БЕЗ значений в git (R-C1).
# Создать реальный Secret: kubectl create secret generic acom-app-secrets --from-env-file=...
# или sealed-secrets / external-secrets.
apiVersion: v1
kind: Secret
metadata:
  name: acom-app-secrets
  namespace: acom-offer-desk-pilot
type: Opaque
stringData:
  # Backend / worker
  DATABASE_URL: "CHANGE_ME_postgresql+sslmode=verify-full"
  JWT_SECRET_KEY: "CHANGE_ME"
  JWT_ALGORITHM: "CHANGE_ME"
  # Keycloak admin / bootstrap (R-C4 — из env, не из realm export)
  KEYCLOAK_ADMIN: "CHANGE_ME"
  KEYCLOAK_ADMIN_PASSWORD: "CHANGE_ME"
  KEYCLOAK_BOOTSTRAP_USERNAME: "CHANGE_ME"
  KEYCLOAK_BOOTSTRAP_PASSWORD: "CHANGE_ME"
  # RabbitMQ (R-E1) — amqps:// в prod
  RABBITMQ_DEFAULT_USER: "CHANGE_ME"
  RABBITMQ_DEFAULT_PASS: "CHANGE_ME"
  CELERY_BROKER_URL: "CHANGE_ME_amqps"
  # MinIO (R-F1–F4)
  MINIO_ROOT_USER: "CHANGE_ME_not_linux_root"
  MINIO_ROOT_PASSWORD: "CHANGE_ME"
  S3_ENDPOINT: "CHANGE_ME"
  S3_ACCESS_KEY: "CHANGE_ME"
  S3_SECRET_KEY: "CHANGE_ME"
