apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: acom-pilot
  namespace: acom-offer-desk-pilot
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  ingressClassName: nginx
  rules:
    - host: aod-pilot.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /iam
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
