apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-db-prepare
  namespace: acom-offer-desk-pilot
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        acom.security/tier: app
    spec:
      restartPolicy: Never
      containers:
        - name: prepare
          image: postgres:16-alpine
          command:
            - /bin/sh
            - -ec
            - |
              export PGSSLMODE=require
              export PGSSLROOTCERT=/etc/ssl/postgres/ca.crt
              until pg_isready -h "$PGHOST" -p 5432 -U "$KC_DB_USERNAME" -d "$KC_DB_URL_DATABASE"; do sleep 2; done
              PGPASSWORD="$KC_DB_PASSWORD" psql -h "$PGHOST" -U "$KC_DB_USERNAME" -d "$KC_DB_URL_DATABASE" -v ON_ERROR_STOP=1 \
                -c "CREATE SCHEMA IF NOT EXISTS \"$KC_DB_SCHEMA\" AUTHORIZATION \"$KC_DB_USERNAME\";"
          env:
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: acom-app-secrets
                  key: KC_DB_URL_HOST
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: acom-app-secrets
                  key: KC_DB_USERNAME
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: acom-app-secrets
                  key: KC_DB_PASSWORD
            - name: KC_DB_URL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: acom-app-secrets
                  key: KC_DB_URL_DATABASE
            - name: KC_DB_SCHEMA
              valueFrom:
                secretKeyRef:
                  name: acom-app-secrets
                  key: KC_DB_SCHEMA
          volumeMounts:
            - name: postgres-tls
              mountPath: /etc/ssl/postgres
              readOnly: true
      volumes:
        - name: postgres-tls
          secret:
            secretName: postgres-tls
