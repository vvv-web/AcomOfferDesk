apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-bootstrap
  namespace: acom-offer-desk-pilot
  labels:
    acom.deploy/component: keycloak-bootstrap
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 3600
  template:
    metadata:
      annotations:
        acom.deploy/sha: "8ea43577e06e5fd8072d1e1438b9f102e0b3b8b9"
    spec:
      restartPolicy: Never
      containers:
        - name: bootstrap
          image: quay.io/keycloak/keycloak:26.5
          command: ["/bin/sh", "/scripts/bootstrap.sh"]
          envFrom:
            - secretRef:
                name: acom-app-secrets
            - configMapRef:
                name: acom-backend-env
          volumeMounts:
            - name: bootstrap-scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: bootstrap-scripts
          configMap:
            name: keycloak-bootstrap-scripts
            defaultMode: 0555
