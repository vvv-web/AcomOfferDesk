apiVersion: batch/v1
kind: Job
metadata:
  name: post-deploy-verify
  namespace: acom-offer-desk-pilot
  labels:
    acom.deploy/component: post-deploy-verify
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1200
  template:
    spec:
      restartPolicy: Never
      volumes:
        - name: pilot-scripts
          configMap:
            name: pilot-job-scripts
            defaultMode: 0555
      containers:
        - name: verify
          image: acom-backend:c96bc2643cfc
          imagePullPolicy: Never
          command: ["/bin/sh", "/pilot-scripts/post-deploy-verify-k8s.sh"]
          volumeMounts:
            - name: pilot-scripts
              mountPath: /pilot-scripts
              readOnly: true
          env:
            - name: PILOT_INGRESS_HOST
              value: "pilot.acom-offer-desk.ru"
            - name: PILOT_INGRESS_SCHEME
              value: "https"
            - name: PILOT_INGRESS_SVC
              value: "ingress-nginx-controller.ingress-nginx.svc.cluster.local"
            - name: KEYCLOAK_INTERNAL_BASE_URL
              value: "http://keycloak:8080/iam"
            - name: SMOKE_S3_ENDPOINT
              value: "minio:9000"
            - name: SMOKE_SKIP_RABBITMQ
              value: "true"
            - name: SMOKE_MINIO_TIMEOUT_SECONDS
              value: "10"
          envFrom:
            - secretRef:
                name: acom-app-secrets
            - configMapRef:
                name: acom-backend-env
