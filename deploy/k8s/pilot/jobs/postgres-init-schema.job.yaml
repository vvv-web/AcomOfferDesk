apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-init-schema
  namespace: acom-offer-desk-pilot
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: psql
          image: postgres:16-alpine
          command:
            - /bin/sh
            - -ec
            - |
              export PGPASSWORD="$POSTGRES_PASSWORD"
              psql -h "$PGHOST" -U "$POSTGRES_USER" -d "$POSTGRES_DB" "sslmode=require" -f /schema/01-schema.sql
          env:
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: acom-app-secrets
                  key: KC_DB_URL_HOST
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: acom-app-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: acom-app-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: acom-app-secrets
                  key: POSTGRES_DB
          volumeMounts:
            - name: schema
              mountPath: /schema
              readOnly: true
      volumes:
        - name: schema
          configMap:
            name: order-database-schema
